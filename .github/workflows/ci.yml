name: CI

on:
  push:
    branches: [main, v2.0.0]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node scripts/check.js
      - name: Unit tests
        run: node --test test/*.test.js

  live-smoke:
    name: Live data smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: offline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Doctor
        run: node bin/crypto-intel.js doctor
      - name: Build briefing
        run: node bin/crypto-intel.js brief --format markdown --out reports/latest.md
      - name: Upload briefing
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: reports/latest.md
